<html lang="en">
<head>

<title>Benefit X – Find schemes and scholarships</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F5F1E4;--surf:#FFFDF6;--ink:#14231D;--mute:#5B6B63;--g:#0F4D3A;--g2:#1C6B52;--gl:#DCEBDD;--gold:#E9A81F;--line:#DDD6C0;--ok:#1B7A4B;--bad:#B3402F;--unk:#8A6A10;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1B16;--surf:#15271F;--ink:#EAF1EC;--mute:#A0B3A9;--g:#6FCB9F;--g2:#8FDDB6;--gl:#1E3A2E;--gold:#F0B93B;--line:#2B4338;--ok:#6FCB9F;--bad:#F08A78;--unk:#E5C060;--on:#0E1B16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1B16;--surf:#15271F;--ink:#EAF1EC;--mute:#A0B3A9;--g:#6FCB9F;--g2:#8FDDB6;--gl:#1E3A2E;--gold:#F0B93B;--line:#2B4338;--ok:#6FCB9F;--bad:#F08A78;--unk:#E5C060;--on:#0E1B16;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,7vw,3.4rem)}h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:0 0 .8em}a{color:var(--g)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}

.logo{display:flex;align-items:center;gap:10px;font:700 1.3rem Fraunces,Georgia,serif;color:var(--g);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.mark{width:32px;height:32px;border-radius:9px;background:var(--g);color:var(--on);display:grid;place-items:center;font:700 1rem Fraunces,serif}
nav.desk{display:none;gap:4px}
nav.desk button{background:none;border:0;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--mute)}
nav.desk button[aria-current="page"],nav.desk button:hover{background:var(--gl);color:var(--g)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surf);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.72rem;font-weight:600;color:var(--mute);cursor:pointer;border-radius:12px;min-height:52px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--g);background:var(--gl)}
main{padding:22px 0 110px}
.hero{padding:10px 0 24px}
.hero p.lead{font-size:1.1rem;color:var(--mute);max-width:52ch}
.routes{display:grid;gap:14px;margin:22px 0}
.route{border:0;text-align:left;cursor:pointer;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative;overflow:hidden}
.route.a{background:var(--g);color:var(--on)}
.route.b{background:var(--gold);color:#1d1604}
.route h3{font-size:1.4rem;margin:0}.route span{opacity:.9}
.route .cnt{margin-top:auto;font-weight:700}
.route svg{position:absolute;right:-10px;top:-10px;width:120px;height:120px;opacity:.14}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.journey{display:grid;gap:12px;counter-reset:s;padding:0;list-style:none;margin:0}
.journey li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.journey li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--gl);color:var(--g)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.unk{background:color-mix(in srgb,var(--gold) 28%,transparent);color:var(--unk)}
.chip.demo{border:1px dashed var(--mute);background:none;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 20px;border-radius:999px;border:2px solid var(--g);background:var(--g);color:var(--on);font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:none;color:var(--g)}.btn.sm{min-height:38px;padding:0 14px;font-size:.9rem}
.btn[aria-pressed="true"]{background:var(--gl);color:var(--g)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{display:grid;gap:10px;margin-bottom:16px}
input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surf)}
textarea{min-height:80px}
label{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
.grid2{display:grid;gap:14px}
.sc{display:flex;flex-direction:column;gap:8px;cursor:pointer;margin:0}
.sc h3{margin:0}.sc .meta{color:var(--mute);font-size:.9rem}
.sc:hover{border-color:var(--g)}
.reason{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.reason:first-child{border-top:0}
.ico{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.ico.ok{background:var(--ok);color:var(--on)}.ico.bad{background:var(--bad);color:var(--on)}.ico.unk{background:var(--gold);color:#1d1604}
.check{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);margin:0;font-weight:500}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--g)}
.note{font-size:.88rem;color:var(--mute);background:var(--gl);padding:10px 14px;border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font:700 1.9rem Fraunces,serif;color:var(--g)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.9rem}
.bar i{display:block;height:10px;border-radius:6px;background:var(--g);min-width:4px}
.bar span:first-child{width:120px;flex:none}
.tl{list-style:none;padding:0;margin:0;border-left:2px solid var(--line)}
.tl li{padding:0 0 12px 14px;position:relative;font-size:.92rem}
.tl li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--g)}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.back{background:none;border:0;color:var(--g);font-weight:700;cursor:pointer;padding:8px 0;margin-bottom:6px;min-height:44px}
.err{color:var(--bad);font-size:.85rem;margin-top:4px}
@media(min-width:720px){nav.tabs{display:none}nav.desk{display:flex}main{padding-bottom:50px}.routes,.grid2{grid-template-columns:1fr 1fr}.toast{bottom:30px}.search{grid-template-columns:2fr 1fr 1fr}}
@media(prefers-reduced-motion:no-preference){.view{animation:in .25s ease}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
</head>

function list(t){const L=S.filter(s=>s.t==t&&(!q||(s.title+s.sum+s.dept).toLowerCase().includes(q.toLowerCase()))&&(fMatch=="all"||match(s).v==fMatch));
return `<section class="view"><h1 style="font-size:2rem">${t=="student"?"Student scholarships":"Citizen schemes"}</h1>
<div class="search"><div><label for="q">Search</label><input id="q" type="search" value="${esc(q)}" placeholder="Try fee, health or pension"></div><div><label for="fm">Show</label><select id="fm"><option value="all">All records</option><option value="ok" ${fMatch=="ok"?"selected":""}>Potential matches</option><option value="unk" ${fMatch=="unk"?"selected":""}>Need more details</option><option value="bad" ${fMatch=="bad"?"selected":""}>Not a match</option></select></div></div>
${L.length?`<div class="grid2">${L.map(card).join("")}</div>`:`<div class="empty"><b>No records found.</b><p>Clear the search or change the filter.</p><button class="btn sm ghost" data-act="clear">Clear filters</button></div>`}</section>`}
function detail(id){const s=S.find(x=>x.id==id);if(!s)return '<div class="empty">Scheme not found.</div>';
const m=match(s),sv=D.saved.includes(id),a=D.apps[id],ck=D.checks[id]||[];
return `<section class="view"><button class="back" data-go="${s.t}">← Back to ${s.t=="student"?"scholarships":"schemes"}</button>
<div class="row"><span class="chip">${s.t=="student"?"Scholarship":"Citizen scheme"}</span><span class="chip demo">Sample data</span></div><h1 style="font-size:2rem;margin-top:8px">${esc(s.title)}</h1><p class="meta" style="color:var(--mute)">${esc(s.dept)} · Source: ${esc(SRC[s.src][0])} · Last verified: not yet verified</p>
<div class="row" style="margin:10px 0 18px"><button class="btn ghost" data-act="save" data-id="${id}" aria-pressed="${sv}">${sv?"Saved":"Save scheme"}</button>${a?"":`<button class="btn" data-act="track" data-id="${id}">Track my application</button>`}<a class="btn ghost" href="${SRC[s.src][1]}" target="_blank" rel="noopener noreferrer">Official portal</a></div>
<div class="card"><h3>Does it fit you? ${mchip(m)}</h3>${m.v=="none"?'<p>Add your profile to see reasons.</p><button class="btn sm" data-go="profile">Set up profile</button>':m.out.map(o=>`<div class="reason"><span class="ico ${o[0]}" aria-hidden="true">${o[0]=="ok"?"✓":o[0]=="bad"?"✕":"?"}</span><span>${esc(o[1])}</span></div>`).join("")}<p class="note" style="margin:10px 0 0">A potential match is not an approval. Only the official portal can confirm eligibility.</p></div>
<div class="card"><h3>What you get</h3><p style="margin:0">${esc(s.ben)}</p></div>
<div class="card"><h3>Documents to prepare</h3>${s.docs.map((d,i)=>`<label class="check"><input type="checkbox" data-act="chk" data-id="${id}" data-i="${i}" ${ck.includes(i)?"checked":""}>${esc(d)}</label>`).join("")}<div class="meta" style="color:var(--mute);margin-top:6px">${ck.length} of ${s.docs.length} ready. No uploads needed.</div></div>
<div class="card"><h3>How to apply</h3><ol style="padding-left:20px;margin:0">${s.steps.map(x=>`<li style="margin:6px 0">${esc(x)}</li>`).join("")}</ol></div>
${a?tracker(id,a):""}</section>`}
function tracker(id,a){return `<div class="card"><h3>My application</h3><p class="note">Status is entered by you. Benefit X does not read live government status.</p>
<div style="display:grid;gap:12px;margin:12px 0"><div><label for="st">Status</label><select id="st">${ST.map(x=>`<option ${a.status==x?"selected":""}>${x}</option>`).join("")}</select></div><div><label for="ao">Date applied (optional)</label><input id="ao" type="date" value="${esc(a.applied||"")}"></div><div><label for="rf">Reference code (optional)</label><input id="rf" value="${esc(a.ref||"")}" maxlength="40"></div><div><label for="nt">Notes</label><textarea id="nt" maxlength="300">${esc(a.notes||"")}</textarea></div></div>
<div class="row"><button class="btn" data-act="upd" data-id="${id}">Save update</button><button class="btn ghost sm" data-act="del" data-id="${id}">Remove tracker</button></div>
<h3 style="margin-top:18px">Timeline</h3><ul class="tl">${a.events.slice().reverse().map(e=>`<li><b>${esc(e.s)}</b> <span class="meta" style="color:var(--mute)">${esc(e.d)}</span>${e.n?"<br>"+esc(e.n):""}</li>`).join("")}</ul></div>`}
function dash(){const ap=Object.entries(D.apps),cnt={};ap.forEach(([,a])=>cnt[a.status]=(cnt[a.status]||0)+1);const mx=Math.max(1,...Object.values(cnt)),pm=D.p?S.filter(s=>match(s).v=="ok").length:0;
return `<section class="view"><h1 style="font-size:2rem">My dashboard</h1>
${D.p?`<div class="card"><b>${esc(D.p.name||"Your profile")}</b><div class="meta" style="color:var(--mute)">${D.p.type=="student"?"Student":"Citizen"}${D.p.state?" · "+esc(D.p.state):""}${D.p.edu?" · "+esc(D.p.edu):""}</div></div>`:`<div class="card row" style="justify-content:space-between"><span>Add your profile to see potential matches.</span><button class="btn sm" data-go="profile">Set up profile</button></div>`}
<div class="stats"><div class="stat"><b>${pm}</b>Potential matches</div><div class="stat"><b>${D.saved.length}</b>Saved</div><div class="stat"><b>${ap.length}</b>Applications</div></div>
<div class="card"><h3>Application status</h3>${ap.length?ST.filter(x=>cnt[x]).map(x=>`<div class="bar"><span>${x}</span><i style="width:${cnt[x]/mx*50}%"></i><b>${cnt[x]}</b></div>`).join(""):'<div class="empty" style="padding:14px"><b>No applications yet.</b><p>Open a scheme and choose Track my application.</p></div>'}</div>
<div class="card"><h3>Saved schemes</h3>${D.saved.length?D.saved.map(i=>S.find(s=>s.id==i)).filter(Boolean).map(s=>`<div class="reason"><a href="#s.${s.id}" data-go="s.${s.id}" style="font-weight:600">${esc(s.title)}</a></div>`).join(""):'<p class="meta" style="color:var(--mute);margin:0">Nothing saved yet.</p>'}</div>
<p class="note">Saved on this device for the prototype demo. Production version stores records in a database per signed-in user.</p></section>`}
function profile(){const p=D.p||{type:"student"};const o=(a,v)=>a.map(x=>`<option ${v==x?"selected":""}>${x}</option>`).join("");
return `<section class="view"><h1 style="font-size:2rem">Your profile</h1><p class="meta" style="color:var(--mute)">Only what matching needs. Use fictional details for the demo.</p>
<form class="card" id="pf" novalidate style="display:grid;gap:14px"><div><label for="f-type">I am a</label><select id="f-type"><option value="student" ${p.type=="student"?"selected":""}>Student</option><option value="citizen" ${p.type=="citizen"?"selected":""}>Citizen</option></select></div>
<div><label for="f-name">First name (optional)</label><input id="f-name" value="${esc(p.name||"")}" maxlength="40"></div>
<div><label for="f-age">Age</label><input id="f-age" type="number" inputmode="numeric" min="5" max="99" value="${esc(p.age||"")}"><div class="err" id="e-age"></div></div>
<div><label for="f-state">State</label><select id="f-state"><option value="">Select</option>${o(STATES,p.state)}</select></div>
<div><label for="f-edu">Education level</label><select id="f-edu"><option value="">Select</option>${o(ED,p.edu)}</select></div>
<div><label for="f-income">Yearly family income (₹)</label><input id="f-income" type="number" inputmode="numeric" min="0" value="${esc(p.income||"")}"><div class="err" id="e-inc"></div></div>
<div><label for="f-cat">Category (optional)</label><select id="f-cat"><option value="">Prefer not to say</option>${o(CAT,p.category)}</select></div>
<div><label for="f-gen">Gender (optional)</label><select id="f-gen"><option value="">Prefer not to say</option>${o(["Female","Male","Other"],p.gender)}</select></div>
<label class="check" style="border:0"><input type="checkbox" id="f-ok" ${D.p?"checked":""}>I agree to use these details only to match schemes on this device.</label><div class="err" id="e-ok"></div>
<button class="btn" type="submit">Save profile</button></form></section>`}
function render(){let h;
if(view=="home")h=home();else if(view=="student"||view=="citizen")h=list(view);else if(view.startsWith("s."))h=detail(view.slice(2));else if(view=="dash")h=dash();else if(view=="profile")h=profile();else h=home();
document.getElementById("app").innerHTML=h;navs()}
const app=document.getElementById("app");
document.addEventListener("click",async e=>{const g=e.target.closest("[data-go]");const a=e.target.closest("[data-act]");
if(a){const id=a.dataset.id,act=a.dataset.act;
if(act=="clear"){q="";fMatch="all";render()}
if(act=="save"){const i=D.saved.indexOf(id);if(i<0){D.saved.push(id);toast("Scheme saved")}else{D.saved.splice(i,1);toast("Removed from saved")}save();render()}
if(act=="track"){D.apps[id]={status:"Planning",applied:"",ref:"",notes:"",events:[{s:"Planning",d:new Date().toLocaleDateString("en-IN"),n:"Tracker created"}]};save();try{await syncTrackerToSupabase(id)}catch(err){console.error(err);toast("Saved on this device, but database sync failed")}if(!String(id).startsWith("db-"))toast("Tracker created on this device");else if(authSession?.access_token)toast("Tracker synced to Supabase");render()}
if(act=="upd"){const x=D.apps[id],ns=document.getElementById("st").value;const note=document.getElementById("nt").value;
if(ns!=x.status)x.events.push({s:ns,d:new Date().toLocaleDateString("en-IN"),n:note});x.status=ns;x.applied=document.getElementById("ao").value;x.ref=document.getElementById("rf").value;x.notes=note;save();try{await syncTrackerToSupabase(id);toast(String(id).startsWith("db-")&&authSession?.access_token?"Update synced to Supabase":"Application updated on this device")}catch(err){console.error(err);toast("Saved locally; database sync failed")}render()}
if(act=="del"){delete D.apps[id];save();try{await syncTrackerToSupabase(id,true);toast("Tracker removed")}catch(err){console.error(err);toast("Removed locally; database sync failed")}render()}
return}
if(g){e.preventDefault();go(g.dataset.go)}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.matches("article[data-go]"))go(e.target.dataset.go)});
document.addEventListener("change",e=>{const t=e.target;
if(t.dataset.act=="chk"){const id=t.dataset.id,i=+t.dataset.i;const c=D.checks[id]=D.checks[id]||[];const k=c.indexOf(i);if(t.checked&&k<0)c.push(i);if(!t.checked&&k>=0)c.splice(k,1);save();render()}
if(t.id=="fm"){fMatch=t.value;render()}});
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value;const pos=q.length;render();const el=document.getElementById("q");el.focus();el.setSelectionRange(pos,pos)}});
document.addEventListener("submit",e=>{e.preventDefault();const v=id=>document.getElementById(id).value;let bad=false;
const age=v("f-age"),inc=v("f-income");
document.getElementById("e-age").textContent=age&&(age<5||age>99)?"Enter an age between 5 and 99.":"";
document.getElementById("e-inc").textContent=inc&&inc<0?"Income cannot be negative.":"";
document.getElementById("e-ok").textContent=document.getElementById("f-ok").checked?"":"Please agree to continue.";
if(document.querySelector(".err:not(:empty)"))return;
D.p={type:v("f-type"),name:v("f-name").trim(),age,state:v("f-state"),edu:v("f-edu"),income:inc,category:v("f-cat"),gender:v("f-gen")};save();toast("Profile saved");go(D.p.type)});
// Load public scheme rows from Supabase. Profile, saved items and trackers remain local until sign-in is added.
async function loadSupabaseSchemes(){
  const configured = SUPABASE_URL.startsWith("https://") &&
    !SUPABASE_URL.includes("PASTE_YOUR") &&
    !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_YOUR") &&
    SUPABASE_PUBLISHABLE_KEY.trim().length > 10;
  if (!configured) return;
  try {
    const response = await fetch(`${SUPABASE_URL.replace(/\/$/, "")}/rest/v1/schemes?select=id,title,description,category,eligibility,benefits,official_url&order=id.asc`, {
      headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}` }
    });
    if (!response.ok) throw new Error(`Supabase returned HTTP ${response.status}`);
    const rows = await response.json();
    const dbSchemes = rows.map(row => {
      const key = `db-${row.id}`;
      SRC[key] = ["Benefit X database", row.official_url || "https://www.myscheme.gov.in/"];
      return {
        id: key,
        dbSchemeId: row.id,
        t: row.category === "scholarship" ? "student" : "citizen",
        title: row.title || "Untitled scheme",
        dept: "Benefit X database",
        src: key,
        sum: row.description || "Details will be added soon.",
        ben: row.benefits || "Check the official portal for benefit details.",
        rules: {},
        docs: [],
        steps: ["Review eligibility and current requirements on the official portal", "Follow the official application instructions"]
      };
    });
    // Keep the existing prototype cards, and add the live database records.
    S = S.filter(item => !String(item.id).startsWith("db-")).concat(dbSchemes);
    render();
    toast(`Connected to Supabase: ${dbSchemes.length} database record(s)`);
  } catch (error) {
    console.error("Benefit X Supabase connection error:", error);
    toast("Could not load database records. Check URL, key and table permissions.");
  }
}
document.getElementById("accountBtn").addEventListener("click",()=>{document.getElementById("authLayer").style.display="block";authUI()});
document.getElementById("authClose").addEventListener("click",()=>document.getElementById("authLayer").style.display="none");
document.getElementById("authSignup").addEventListener("click",()=>authAction("signup"));
document.getElementById("authForm").addEventListener("submit",e=>{e.preventDefault();authAction("login")});
document.getElementById("authSignout").addEventListener("click",()=>{authSession=null;localStorage.removeItem(AUTH_KEY);authUI();toast("Signed out");});
async function authAction(mode){const msg=document.getElementById("authMsg");if(!sbReady()){msg.textContent="Add your Supabase URL and publishable key in the script first.";return;}const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;if(!email||password.length<6){msg.textContent="Enter a valid email and a password of at least 6 characters.";return;}msg.textContent=mode==="signup"?"Creating account…":"Signing in…";try{const endpoint=mode==="signup"?"/auth/v1/signup":"/auth/v1/token?grant_type=password";const r=await fetch(`${SUPABASE_URL.replace(/\/$/,"")}${endpoint}`,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});const data=await r.json();if(!r.ok)throw new Error(data.msg||data.message||data.error_description||data.error||"Authentication failed");if(data.access_token){authSession={access_token:data.access_token,refresh_token:data.refresh_token,user:data.user};localStorage.setItem(AUTH_KEY,JSON.stringify(authSession));authUI();await loadMyTrackers();msg.textContent="Signed in. Your trackers will sync securely.";toast("Signed in successfully");}else{msg.textContent="Account created. If email confirmation is enabled, confirm your email, then sign in.";} }catch(err){msg.textContent=err.message;}}
const h=location.hash.slice(1);if(h&&(["home","student","citizen","dash","profile"].includes(h)||h.startsWith("s.")))view=h;
render();authUI();loadSupabaseSchemes();if(authSession?.access_token)loadMyTrackers();
</script>
</body>
</html>
